<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>a website</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Modern Typography: Cairo (Arabic) & Plus Jakarta Sans (English) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '"Cairo"', 'sans-serif'],
                        arabic: ['"Cairo"', '"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        ocean: {
                            950: '#060d18',
                            900: '#08111e',
                            800: '#0e1d33',
                            700: '#162c4c',
                        },
                        skyglow: {
                            300: '#bae6fd',
                            400: '#7cc0ff',
                            500: '#38bdf8',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #08111e;
            color: #f0f7ff;
            font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        html[lang="en"] body {
            font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
        }

        /* Serene Watercolor Ambient Glows */
        .ambient-orb {
            position: fixed;
            border-radius: 9999px;
            filter: blur(110px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.42;
        }

        /* Glassmorphism Card Styling */
        .glass-card {
            background: rgba(14, 29, 51, 0.58);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(124, 192, 255, 0.16);
            box-shadow: 0 20px 50px rgba(3, 8, 18, 0.55);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
    <!-- Auth Selection Modal (Visitor Login + Private Creator Admin Account) -->
    <div id="auth-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-ocean-950/80 backdrop-blur-md" onclick="closeAuthModal(event)">
        <div class="glass-card max-w-md w-full rounded-3xl p-6 sm:p-7 space-y-5 border-sky-400/30 relative" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b border-sky-300/15 pb-4">
                <div>
                    <h3 id="auth-modal-title" class="text-lg sm:text-xl font-bold text-white">تسجيل الدخول</h3>
                    <p id="auth-modal-sub" class="text-xs text-sky-200/70 mt-0.5">اختر طريقة الدخول للموقع</p>
                </div>
                <button onclick="closeAuthModal()" class="w-9 h-9 rounded-xl glass-subtle hover:bg-white/10 flex items-center justify-center text-sky-200 transition">
                    ✕
                </button>
            </div>

            <!-- Role Switcher Tabs: Visitor vs Private Creator Account -->
            <div class="grid grid-cols-2 gap-2 p-1 rounded-2xl bg-ocean-950/80 border border-sky-300/15">
                <button type="button" id="auth-tab-fan" onclick="switchAuthTab('fan')" class="py-2.5 px-3 rounded-xl bg-sky-400 text-ocean-950 font-bold text-xs sm:text-sm transition">
                    دخول المتابعين
                </button>
                <button type="button" id="auth-tab-admin" onclick="switchAuthTab('admin')" class="py-2.5 px-3 rounded-xl text-sky-200/75 hover:text-white font-bold text-xs sm:text-sm transition flex items-center justify-center gap-1.5">
                    <span>🔒</span>
                    <span id="auth-tab-admin-text">حسابي الخاص (a)</span>
                </button>
            </div>

            <!-- Tab 1: Seamless Visitor / Fan Login -->
            <form id="fan-login-form" onsubmit="handleFanLogin(event)" class="space-y-4">
                <div class="space-y-1.5">
                    <label id="label-member-name" class="block text-xs font-semibold text-sky-200">اسمك المستعار</label>
                    <input type="text" id="member-name-input" required maxlength="30" placeholder="اكتب اسمك الذي سيظهر على صورك في المتحف"
                        class="w-full rounded-xl bg-ocean-950/70 border border-sky-300/20 focus:border-sky-400 focus:outline-none px-4 py-3 text-sm text-white placeholder-sky-200/30 transition">
                </div>

                <!-- Optional Avatar Badge Color/Icon -->
                <div class="space-y-1.5">
                    <label id="label-avatar-style" class="block text-xs font-semibold text-sky-200">اختر لون رمزك</label>
                    <div class="flex items-center gap-2.5" id="avatar-color-picker">
                        <button type="button" onclick="selectAvatarColor('#38BDF8', this)" class="w-8 h-8 rounded-full bg-sky-400 ring-2 ring-white transition"></button>
                        <button type="button" onclick="selectAvatarColor('#818CF8', this)" class="w-8 h-8 rounded-full bg-indigo-400 opacity-75 hover:opacity-100 transition"></button>
                        <button type="button" onclick="selectAvatarColor('#2DD4BF', this)" class="w-8 h-8 rounded-full bg-teal-400 opacity-75 hover:opacity-100 transition"></button>
                        <button type="button" onclick="selectAvatarColor('#F472B6', this)" class="w-8 h-8 rounded-full bg-pink-400 opacity-75 hover:opacity-100 transition"></button>
                        <button type="button" onclick="selectAvatarColor('#FBBF24', this)" class="w-8 h-8 rounded-full bg-amber-400 opacity-75 hover:opacity-100 transition"></button>
                    </div>
                </div>

                <button type="submit" id="quick-login-btn" class="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-sky-400 to-blue-500 hover:from-sky-300 hover:to-blue-400 text-ocean-950 font-bold text-sm shadow-lg shadow-sky-500/20 transition">
                    دخول مباشر للمتحف
                </button>
            </form>

            <!-- Tab 2: Private Creator Admin Login (Password Protected) -->
            <form id="admin-login-form" onsubmit="handleAdminLogin(event)" class="hidden space-y-4">
                <div class="p-3 rounded-2xl bg-sky-400/10 border border-sky-300/20 text-xs text-sky-200 leading-relaxed">
                    <span id="admin-lock-note">هذه البوابة مخصصة لصاحب الموقع <strong>a</strong> فقط للتحكم بالمتحف وإعدادات الصفحة.</span>
                </div>

                <div class="space-y-1.5">
                    <label id="label-admin-user" class="block text-xs font-semibold text-sky-200">اسم المستخدم</label>
                    <input type="text" id="admin-username-input" required placeholder="admin" dir="ltr"
                        class="w-full rounded-xl bg-ocean-950/70 border border-sky-300/20 focus:border-sky-400 focus:outline-none px-4 py-3 text-sm text-white placeholder-sky-200/30 transition">
                </div>

                <div class="space-y-1.5">
                    <label id="label-admin-pass" class="block text-xs font-semibold text-sky-200">كلمة المرور الخاصة</label>
                    <input type="password" id="admin-password-input" required placeholder="••••••••" dir="ltr"
                        class="w-full rounded-xl bg-ocean-950/70 border border-sky-300/20 focus:border-sky-400 focus:outline-none px-4 py-3 text-sm text-white placeholder-sky-200/30 transition">
                </div>

                <button type="submit" id="admin-submit-btn" class="w-full py-3.5 px-4 rounded-2xl bg-white hover:bg-sky-100 text-ocean-950 font-bold text-sm shadow-lg transition flex items-center justify-center gap-2">
                    <span>🔓</span>
                    <span id="admin-login-btn-text">دخول إلى حسابي الخاص</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Private Creator Control Panel Modal (Visible Only to 'a') -->
    <div id="admin-panel-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-ocean-950/85 backdrop-blur-md" onclick="closeAdminPanel(event)">
        <div class="glass-card max-w-lg w-full rounded-3xl p-6 sm:p-7 space-y-5 border-amber-300/35 relative max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b border-sky-300/15 pb-4">
                <div class="flex items-center gap-2.5">
                    <span class="w-9 h-9 rounded-xl bg-amber-400/20 border border-amber-300/40 text-amber-300 flex items-center justify-center text-base">👑</span>
                    <div>
                        <h3 id="panel-title" class="text-lg font-bold text-white">لوحة تحكم حسابي الخاص (a)</h3>
                        <p id="panel-sub" class="text-xs text-sky-200/70">تعديل بيانات الموقع، تثبيت الصور، وتغيير كلمة المرور</p>
                    </div>
                </div>
                <button onclick="closeAdminPanel()" class="w-9 h-9 rounded-xl glass-subtle hover:bg-white/10 flex items-center justify-center text-sky-200 transition">
                    ✕
                </button>
            </div>

            <form onsubmit="saveAdminSettings(event)" class="space-y-4">
                <div class="space-y-1.5">
                    <label id="label-edit-subs" class="block text-xs font-semibold text-sky-200">عدد المشتركين في القناة</label>
                    <input type="text" id="edit-subs-input" required dir="ltr"
                        class="w-full rounded-xl bg-ocean-950/70 border border-sky-300/20 focus:border-sky-400 focus:outline-none px-4 py-2.5 text-sm text-white transition">
                </div>

                <div class="space-y-1.5">
                    <label id="label-edit-email" class="block text-xs font-semibold text-sky-200">بريد التواصل</label>
                    <input type="email" id="edit-email-input" required dir="ltr"
                        class="w-full rounded-xl bg-ocean-950/70 border border-sky-300/20 focus:border-sky-400 focus:outline-none px-4 py-2.5 text-sm text-white transition">
                </div>

                <div class="space-y-1.5">
                    <label id="label-edit-bio" class="block text-xs font-semibold text-sky-200">النبذة التعريفية الرئيسية</label>
                    <textarea id="edit-bio-input" rows="2"
                        class="w-full rounded-xl bg-ocean-950/70 border border-sky-300/20 focus:border-sky-400 focus:outline-none px-4 py-2.5 text-sm text-white transition"></textarea>
                </div>

                <div class="pt-2 border-t border-sky-300/15 space-y-1.5">
                    <label id="label-new-pass" class="block text-xs font-semibold text-amber-300">تغيير كلمة مرور حسابك الخاص (اختياري)</label>
                    <input type="password" id="edit-new-pass-input" placeholder="اتركه فارغاً للإبقاء على كلمة المرور الحالية" dir="ltr"
                        class="w-full rounded-xl bg-ocean-950/70 border border-amber-300/25 focus:border-amber-400 focus:outline-none px-4 py-2.5 text-sm text-white placeholder-sky-200/30 transition">
                </div>

                <button type="submit" id="save-admin-btn" class="w-full py-3 px-4 rounded-2xl bg-gradient-to-r from-amber-400 to-sky-400 text-ocean-950 font-bold text-sm shadow-lg transition">
                    حفظ التعديلات
                </button>
            </form>
        </div>
    </div>

    <!-- Lightbox Image Modal -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 sm:p-8 bg-ocean-950/90 backdrop-blur-xl" onclick="closeLightbox(event)">
        <div class="relative max-w-3xl w-full glass-card rounded-3xl overflow-hidden border-sky-300/25 shadow-2xl" onclick="event.stopPropagation()">
            <button onclick="closeLightbox()" class="absolute top-4 end-4 z-10 w-10 h-10 rounded-full bg-ocean-950/75 hover:bg-sky-500 text-white hover:text-ocean-950 border border-white/15 flex items-center justify-center transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
            <div class="bg-ocean-950/80 flex items-center justify-center max-h-[70vh] overflow-hidden">
                <img id="lightbox-img" src="" alt="Fan Art Preview" class="w-full h-full max-h-[70vh] object-contain">
            </div>
            <div class="p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-ocean-900/90">
                <div>
                    <h4 id="lightbox-title" class="text-base sm:text-lg font-bold text-white"></h4>
                    <p id="lightbox-author" class="text-xs sm:text-sm text-sky-300/80 mt-0.5"></p>
                </div>
                <div class="flex items-center gap-3">
                    <button id="lightbox-like-btn" class="px-4 py-2 rounded-xl glass-subtle hover:border-sky-400/50 text-sm font-semibold flex items-center gap-2 transition">
                        <span id="lightbox-heart">♥</span>
                        <span id="lightbox-likes-count">0</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Submit Art Modal -->
    <div id="upload-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-ocean-950/80 backdrop-blur-md" onclick="closeUploadModal(event)">
        <div class="glass-card max-w-lg w-full rounded-3xl p-6 sm:p-7 space-y-5 border-sky-400/30 relative" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b border-sky-300/15 pb-4">
                <div>
                    <h3 id="modal-upload-title" class="text-lg sm:text-xl font-bold text-white">إضافة صورة إلى المتحف</h3>
                    <p id="modal-upload-sub" class="text-xs text-sky-200/70 mt-0.5">شارك رسمتك أو تصميمك مع مجتمع a</p>
                </div>
                <button onclick="closeUploadModal()" class="w-9 h-9 rounded-xl glass-subtle hover:bg-white/10 flex items-center justify-center text-sky-200 transition">
                    ✕
                </button>
            </div>

            <form id="art-form" onsubmit="handleArtSubmit(event)" class="space-y-4">
                <!-- Title Input -->
                <div class="space-y-1.5">
                    <label id="label-art-title" class="block text-xs font-semibold text-sky-200">عنوان الصورة / الرسمة</label>
                    <input type="text" id="art-title-input" required maxlength="60" placeholder="مثال: رسمة لـ a مع الفراشات الزرقاء"
                        class="w-full rounded-xl bg-ocean-950/70 border border-sky-300/20 focus:border-sky-400 focus:outline-none px-4 py-3 text-sm text-white placeholder-sky-200/30 transition">
                </div>

                <!-- Source Mode Switcher (File Upload vs Image URL) -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label id="label-art-source" class="block text-xs font-semibold text-sky-200">اختيار الصورة</label>
                        <div class="flex rounded-xl bg-ocean-950/80 p-1 border border-sky-300/15 text-xs">
                            <button type="button" id="tab-file" onclick="switchUploadTab('file')" class="px-3 py-1 rounded-lg bg-sky-400 text-ocean-950 font-bold transition">
                                رفع ملف
                            </button>
                            <button type="button" id="tab-url" onclick="switchUploadTab('url')" class="px-3 py-1 rounded-lg text-sky-200/75 hover:text-white font-semibold transition">
                                رابط صورة
                            </button>
                        </div>
                    </div>

                    <!-- File Dropzone -->
                    <div id="input-file-wrapper">
                        <label for="art-file-input" class="flex flex-col items-center justify-center w-full h-36 rounded-2xl border-2 border-dashed border-sky-300/25 hover:border-sky-400/60 bg-ocean-950/50 cursor-pointer transition p-4 text-center">
                            <svg class="w-8 h-8 text-sky-400 mb-2" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                            <span id="dropzone-text" class="text-xs sm:text-sm font-medium text-sky-100">اضغط لاختيار صورة من جهازك</span>
                            <span id="dropzone-hint" class="text-[11px] text-sky-300/60 mt-1">PNG, JPG, WEBP (يتم ضغطها تلقائياً)</span>
                            <input type="file" id="art-file-input" accept="image/*" class="hidden" onchange="previewSelectedFile(event)">
                        </label>
                    </div>

                    <!-- URL Input -->
                    <div id="input-url-wrapper" class="hidden">
                        <input type="url" id="art-url-input" placeholder="https://example.com/image.png" oninput="previewUrlImage(this.value)"
                            class="w-full rounded-xl bg-ocean-950/70 border border-sky-300/20 focus:border-sky-400 focus:outline-none px-4 py-3 text-sm text-white placeholder-sky-200/30 transition" dir="ltr">
                    </div>
                </div>

                <!-- Live Image Preview -->
                <div id="upload-preview-box" class="hidden rounded-2xl overflow-hidden border border-sky-300/20 bg-ocean-950/70 max-h-44 flex items-center justify-center">
                    <img id="upload-preview-img" src="" alt="Preview" class="max-h-44 w-auto object-contain">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-art-btn" class="w-full py-3.5 px-5 rounded-2xl bg-gradient-to-r from-sky-400 to-blue-500 hover:from-sky-300 hover:to-blue-400 text-ocean-950 font-bold text-sm shadow-lg shadow-sky-500/25 transition flex items-center justify-center gap-2">
                    <span id="submit-btn-label">نشر في المتحف</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Top Glass Navbar -->
    <header class="sticky top-0 z-40 border-b border-sky-300/10 bg-ocean-900/75 backdrop-blur-xl">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-3">
            
            <!-- Brand -->
            <a href="#" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-2xl overflow-hidden border border-sky-300/40 shadow-md shadow-sky-500/15 group-hover:scale-105 transition-transform">
                    <img src="IMG_6979.jpeg" alt="a" onerror="this.onerror=null; this.src='https://placehold.co/100x100/162C4C/BAE6FD?text=a';" class="w-full h-full object-cover">
                </div>
                <span class="text-base sm:text-lg font-extrabold tracking-tight text-white">
                    a website
                </span>
            <!-- Right Controls: Language + Auth / Private Account -->
            <div class="flex items-center gap-2.5 sm:gap-3">
                
                <!-- Language Switcher -->
                <button onclick="toggleLanguage()" class="px-3.5 py-2 rounded-xl glass-subtle hover:border-sky-400/40 text-xs sm:text-sm font-semibold text-sky-100 flex items-center gap-2 transition">
                    <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
                    </svg>
                    <span id="lang-label">English</span>
                </button>

                <!-- Auth Area: Logged Out State -->
                <button id="google-signin-btn" onclick="openAuthModal()" class="px-4 py-2 rounded-xl bg-white hover:bg-sky-50 text-ocean-950 text-xs sm:text-sm font-bold shadow-lg shadow-black/20 flex items-center gap-2 transition">
                    <svg class="w-4 h-4 shrink-0 text-ocean-950" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    <span id="signin-text">تسجيل الدخول</span>
                </button>

                <!-- Auth Area: Logged In Profile Pill -->
                <div id="user-profile-pill" class="hidden items-center gap-2 ps-2 pe-1.5 py-1 rounded-2xl glass-subtle border-sky-400/30">
                    <img id="user-avatar-img" src="" alt="User" class="w-7 h-7 rounded-xl object-cover border border-sky-300/40">
                    <span id="user-display-name" class="text-xs font-bold text-white max-w-[85px] sm:max-w-[120px] truncate"></span>
                    <span id="admin-crown-badge" class="hidden px-2 py-0.5 rounded-lg bg-amber-400/20 border border-amber-300/40 text-amber-300 text-[10px] font-extrabold">
                        ADMIN
                    </span>
                    <button id="open-admin-panel-btn" onclick="openAdminPanel()" class="hidden px-2.5 py-1 rounded-xl bg-amber-400 hover:bg-amber-300 text-ocean-950 text-[11px] font-bold transition">
                        لوحتي
                    </button>
                    <button onclick="handleSignOut()" id="signout-btn" title="Sign Out" class="px-2.5 py-1 rounded-xl bg-rose-500/15 hover:bg-rose-500 text-rose-300 hover:text-white text-[11px] font-bold transition">
                        خروج
                    </button>
                </div>

            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 max-w-5xl mx-auto w-full px-4 sm:px-6 py-10 sm:py-14 space-y-14">

        <!-- Hero Section -->
        <section class="glass-card rounded-[2rem] p-8 sm:p-12 text-center relative overflow-hidden">
            <!-- Decorative subtle butterfly SVG accents matching avatar -->
            <svg class="w-7 h-7 text-sky-400/35 absolute top-7 start-8 animate-float" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c-2.5-4.5-7-6.5-9.5-4.5S1 14 5.5 15.5c-2.5 1.5-2 5 .5 5.5s5.5-2.5 6-6c.5 3.5 3.5 6.5 6 6s3-4 .5-5.5C23 14 24 9.5 21.5 7.5S14.5 7.5 12 12z"/>
            </svg>
            <svg class="w-5 h-5 text-blue-300/30 absolute bottom-8 end-10 animate-float" style="animation-delay: 2s;" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c-2.5-4.5-7-6.5-9.5-4.5S1 14 5.5 15.5c-2.5 1.5-2 5 .5 5.5s5.5-2.5 6-6c.5 3.5 3.5 6.5 6 6s3-4 .5-5.5C23 14 24 9.5 21.5 7.5S14.5 7.5 12 12z"/>
            </svg>

            <div class="max-w-xl mx-auto flex flex-col items-center space-y-5">
                <!-- Full-Color Soft Rounded Channel Avatar -->
                <div class="relative group">
                    <div class="absolute -inset-1.5 rounded-[2rem] bg-gradient-to-tr from-sky-400 via-blue-400 to-white opacity-45 blur-md group-hover:opacity-75 transition duration-500"></div>
                    <div class="relative w-28 h-28 sm:w-36 sm:h-36 rounded-[1.75rem] overflow-hidden border-2 border-white/80 shadow-2xl bg-ocean-800">
                        <img src="IMG_6979.jpeg" alt="a channel avatar" onerror="this.onerror=null; this.src='https://placehold.co/300x300/162C4C/F0F7FF?text=a';" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    </div>
                </div>

                <!-- Badge -->

                    🔒

    <!-- Reliable Local Persistence, Private Creator Account & Museum Engine -->
    <script>
        const STORAGE_KEYS = {
            POSTS: 'a_website_museum_posts_v1',
            SESSION: 'a_website_active_session_v1',
            ADMIN_PASS: 'a_website_admin_secret_v1',
            SETTINGS: 'a_website_site_settings_v1'
        };

        let currentLang = 'ar';
        let currentUser = null; // { uid, displayName, photoURL, isAdmin }
        let museumPosts = [];
        let activeLightboxPostId = null;
        let uploadMode = 'file';
        let compressedBase64Image = '';
        let selectedFanColor = '#38BDF8';

        // Default site settings editable by Admin ('a')
        let siteSettings = {
            subsCount: '3.38k',
            contactEmail: '9gswacontact@gmail.com',
            customBioAr: '',
            customBioEn: ''
        };

        // Initialize application state cleanly on load
        function initApp() {
            // Load Admin password (default: a2026)
            if (!localStorage.getItem(STORAGE_KEYS.ADMIN_PASS)) {
                localStorage.setItem(STORAGE_KEYS.ADMIN_PASS, 'a2026');
            }

            // Load custom site settings if saved by Admin
            try {
                const savedSettings = JSON.parse(localStorage.getItem(STORAGE_KEYS.SETTINGS));
                if (savedSettings) {
                    siteSettings = { ...siteSettings, ...savedSettings };
                }
            } catch (e) {}

            // Load active user session (either Fan or Private Admin 'a')
            try {
                const savedSession = JSON.parse(localStorage.getItem(STORAGE_KEYS.SESSION));
                if (savedSession && savedSession.uid) {
                    currentUser = savedSession;
                }
            } catch (e) {}

            // Load museum posts
            try {
                const savedPosts = JSON.parse(localStorage.getItem(STORAGE_KEYS.POSTS));
                if (Array.isArray(savedPosts)) {
                    museumPosts = savedPosts;
                }
            } catch (e) {
                museumPosts = [];
            }

            applySiteSettingsToDOM();
            updateAuthUI(Boolean(currentUser));
            renderMuseumGrid();
        }

        function savePostsToStorage() {
            try {
                localStorage.setItem(STORAGE_KEYS.POSTS, JSON.stringify(museumPosts));
            } catch (err) {
                showToast(
                    currentLang === 'ar'
                        ? 'ذاكرة المتصفح ممتلئة، يرجى حذف بعض الصور القديمة أو استخدام صورة أصغر'
                        : 'Storage full! Please remove old images or upload a smaller file.'
                );
            }
        }

        function applySiteSettingsToDOM() {
            document.querySelectorAll('.subs-count-val').forEach((el) => {
                el.textContent = siteSettings.subsCount;
            });
            document.getElementById('contact-email-display').textContent = siteSettings.contactEmail;
            document.getElementById('mailto-anchor').href = `mailto:${siteSettings.contactEmail}`;

            if (currentLang === 'ar' && siteSettings.customBioAr) {
                document.getElementById('hero-desc').textContent = siteSettings.customBioAr;
            } else if (currentLang === 'en' && siteSettings.customBioEn) {
                document.getElementById('hero-desc').textContent = siteSettings.customBioEn;
            }
        }

        // Auth Modal Controls
        window.openAuthModal = function () {
            switchAuthTab('fan');
            const modal = document.getElementById('auth-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.openAdminShortcut = function () {
            if (currentUser && currentUser.isAdmin) {
                openAdminPanel();
                return;
            }
            openAuthModal();
            switchAuthTab('admin');
        };

        window.closeAuthModal = function (e) {
            if (e && e.target !== e.currentTarget) return;
            const modal = document.getElementById('auth-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        window.switchAuthTab = function (tab) {
            const fanForm = document.getElementById('fan-login-form');
            const adminForm = document.getElementById('admin-login-form');
            const tabFan = document.getElementById('auth-tab-fan');
            const tabAdmin = document.getElementById('auth-tab-admin');

            if (tab === 'fan') {
                fanForm.classList.remove('hidden');
                adminForm.classList.add('hidden');
                tabFan.className = 'py-2.5 px-3 rounded-xl bg-sky-400 text-ocean-950 font-bold text-xs sm:text-sm transition';
                tabAdmin.className = 'py-2.5 px-3 rounded-xl text-sky-200/75 hover:text-white font-bold text-xs sm:text-sm transition flex items-center justify-center gap-1.5';
            } else {
                fanForm.classList.add('hidden');
                adminForm.classList.remove('hidden');
                tabAdmin.className = 'py-2.5 px-3 rounded-xl bg-white text-ocean-950 font-bold text-xs sm:text-sm transition flex items-center justify-center gap-1.5';
                tabFan.className = 'py-2.5 px-3 rounded-xl text-sky-200/75 hover:text-white font-bold text-xs sm:text-sm transition';
            }
        };

        window.selectAvatarColor = function (hex, btn) {
            selectedFanColor = hex;
            document.querySelectorAll('#avatar-color-picker button').forEach((b) => {
                b.classList.remove('ring-2', 'ring-white', 'opacity-100');
                b.classList.add('opacity-75');
            });
            btn.classList.remove('opacity-75');
            btn.classList.add('ring-2', 'ring-white', 'opacity-100');
        };

        // 1. Visitor / Fan Instant Login
        window.handleFanLogin = function (event) {
            event.preventDefault();
            const nameVal = document.getElementById('member-name-input').value.trim();
            if (!nameVal) return;

            const bgHex = selectedFanColor.replace('#', '');
            currentUser = {
                uid: 'fan_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                displayName: nameVal,
                photoURL: `https://placehold.co/100x100/${bgHex}/08111E?text=${encodeURIComponent(
                    nameVal.charAt(0).toUpperCase()
                )}`,
                isAdmin: false
            };

            localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(currentUser));
            closeAuthModal();
            updateAuthUI(true);
            showToast(
                currentLang === 'ar'
                    ? `أهلاً بك يا ${nameVal}! يمكنك الآن إضافة صورك للمتحف`
                    : `Welcome ${nameVal}! You can now add photos to the museum`
            );
        };

        // 2. Private Creator Admin Login (Password Protected)
        window.handleAdminLogin = function (event) {
            event.preventDefault();
            const username = document.getElementById('admin-username-input').value.trim().toLowerCase();
            const password = document.getElementById('admin-password-input').value;
            const storedPass = localStorage.getItem(STORAGE_KEYS.ADMIN_PASS) || 'a2026';

            if ((username === 'admin' || username === 'a') && password === storedPass) {
                currentUser = {
                    uid: 'creator_admin_a',
                    displayName: 'a (Creator)',
                    photoURL: 'IMG_6979.jpeg',
                    isAdmin: true
                };

                localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(currentUser));
                document.getElementById('admin-login-form').reset();
                closeAuthModal();
                updateAuthUI(true);
                showToast(
                    currentLang === 'ar'
                        ? 'تم الدخول إلى حسابك الخاص بنجاح!'
                        : 'Welcome back to your private Creator account!'
                );
            } else {
                showToast(
                    currentLang === 'ar'
                        ? 'اسم المستخدم أو كلمة المرور غير صحيحة!'
                        : 'Invalid username or password!'
                );
            }
        };

        window.handleSignOut = function () {
            currentUser = null;
            localStorage.removeItem(STORAGE_KEYS.SESSION);
            updateAuthUI(false);
            showToast(currentLang === 'ar' ? 'تم تسجيل الخروج' : 'Signed out');
        };

        function updateAuthUI(isLoggedIn) {
            const signInBtn = document.getElementById('google-signin-btn');
            const profilePill = document.getElementById('user-profile-pill');
            const adminBadge = document.getElementById('admin-crown-badge');
            const adminPanelBtn = document.getElementById('open-admin-panel-btn');

            if (isLoggedIn && currentUser) {
                signInBtn.classList.add('hidden');
                profilePill.classList.remove('hidden');
                profilePill.classList.add('flex');

                document.getElementById('user-display-name').textContent = currentUser.displayName;
                const avatarEl = document.getElementById('user-avatar-img');
                avatarEl.src = currentUser.photoURL;
                avatarEl.onerror = function () {
                    this.onerror = null;
                    this.src = 'https://placehold.co/100x100/38BDF8/08111E?text=a';
                };

                if (currentUser.isAdmin) {
                    adminBadge.classList.remove('hidden');
                    adminPanelBtn.classList.remove('hidden');
                } else {
                    adminBadge.classList.add('hidden');
                    adminPanelBtn.classList.add('hidden');
                }
            } else {
                signInBtn.classList.remove('hidden');
                profilePill.classList.add('hidden');
                profilePill.classList.remove('flex');
                adminBadge.classList.add('hidden');
                adminPanelBtn.classList.add('hidden');
            }
            renderMuseumGrid();
        }

        // Private Admin Control Panel Functions
        window.openAdminPanel = function () {
            if (!currentUser || !currentUser.isAdmin) return;
            document.getElementById('edit-subs-input').value = siteSettings.subsCount;
            document.getElementById('edit-email-input').value = siteSettings.contactEmail;
            document.getElementById('edit-bio-input').value =
                currentLang === 'ar' ? siteSettings.customBioAr : siteSettings.customBioEn;
            document.getElementById('edit-new-pass-input').value = '';

            const modal = document.getElementById('admin-panel-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeAdminPanel = function (e) {
            if (e && e.target !== e.currentTarget) return;
            const modal = document.getElementById('admin-panel-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        window.saveAdminSettings = function (event) {
            event.preventDefault();
            if (!currentUser || !currentUser.isAdmin) return;

            siteSettings.subsCount = document.getElementById('edit-subs-input').value.trim() || '3.38k';
            siteSettings.contactEmail = document.getElementById('edit-email-input').value.trim() || '9gswacontact@gmail.com';
            const bioVal = document.getElementById('edit-bio-input').value.trim();
            if (currentLang === 'ar') {
                siteSettings.customBioAr = bioVal;
            } else {
                siteSettings.customBioEn = bioVal;
            }

            const newPass = document.getElementById('edit-new-pass-input').value.trim();
            if (newPass) {
                localStorage.setItem(STORAGE_KEYS.ADMIN_PASS, newPass);
            }

            localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(siteSettings));
            applySiteSettingsToDOM();
            closeAdminPanel();
            showToast(currentLang === 'ar' ? 'تم حفظ إعدادات حسابك بنجاح!' : 'Creator settings saved!');
        };

        // Admin Pin / Feature Post
        window.togglePinPost = function (postId) {
            if (!currentUser || !currentUser.isAdmin) return;
            const post = museumPosts.find((p) => p.id === postId);
            if (!post) return;
            post.pinned = !post.pinned;
            savePostsToStorage();
            renderMuseumGrid();
            showToast(
                post.pinned
                    ? currentLang === 'ar'
                        ? 'تم تثبيت الصورة في أعلى المتحف ★'
                        : 'Artwork pinned to top ★'
                    : currentLang === 'ar'
                    ? 'تم إلغاء التثبيت'
                    : 'Unpinned'
            );
        };

        // Render Museum Cards
        window.renderMuseumGrid = function () {
            const grid = document.getElementById('museum-grid');
            const emptyState = document.getElementById('museum-empty');

            if (!museumPosts.length) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            const uid = currentUser ? currentUser.uid : null;
            const isAdmin = Boolean(currentUser && currentUser.isAdmin);

            // Sort pinned posts first, then newest first
            const sortedPosts = [...museumPosts].sort((a, b) => {
                if (Boolean(b.pinned) !== Boolean(a.pinned)) {
                    return b.pinned ? 1 : -1;
                }
                return (b.createdAt || 0) - (a.createdAt || 0);
            });

            grid.innerHTML = sortedPosts
                .map((post) => {
                    const likedBy = Array.isArray(post.likedBy) ? post.likedBy : [];
                    const isLiked = uid ? likedBy.includes(uid) : false;
                    const canDelete = isAdmin || (uid && post.authorUid === uid);
                    const safeTitle = escapeHtml(post.title || 'Artwork');
                    const safeAuthor = escapeHtml(post.authorName || 'Fan');
                    const authorAvatar =
                        post.authorPhoto || 'https://placehold.co/64x64/162C4C/BAE6FD?text=a';

                    return `
                    <article class="glass-card rounded-3xl overflow-hidden flex flex-col justify-between group ${
                        post.pinned ? 'ring-2 ring-amber-300/60' : ''
                    }">
                        <!-- Image Thumbnail -->
                        <div onclick="openLightbox('${post.id}')" class="relative aspect-[4/3] bg-ocean-950/80 overflow-hidden cursor-pointer">
                            <img src="${post.imageUrl}" alt="${safeTitle}" loading="lazy"
                                onerror="this.onerror=null; this.src='https://placehold.co/600x450/0E1D33/7CC0FF?text=Artwork';"
                                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            ${
                                post.pinned
                                    ? `<span class="absolute top-3 start-3 px-2.5 py-1 rounded-full bg-amber-400 text-ocean-950 text-[11px] font-extrabold shadow-md flex items-center gap-1">
                                        ★ ${currentLang === 'ar' ? 'مميزة' : 'Featured'}
                                    </span>`
                                    : ''
                            }
                            <div class="absolute inset-0 bg-gradient-to-t from-ocean-950/75 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end justify-between p-4">
                                <span class="text-xs font-semibold text-white bg-ocean-950/70 backdrop-blur-md px-3 py-1 rounded-full border border-white/15">
                                    ${currentLang === 'ar' ? 'اضغط للتكبير' : 'Click to expand'}
                                </span>
                            </div>
                        </div>

                        <!-- Card Info -->
                        <div class="p-4 sm:p-5 space-y-3.5">
                            <h3 class="text-sm sm:text-base font-bold text-white line-clamp-1">${safeTitle}</h3>

                            <div class="flex items-center justify-between gap-2 pt-1 border-t border-sky-300/10">
                                <div class="flex items-center gap-2 min-w-0">
                                    <img src="${authorAvatar}" alt="${safeAuthor}" onerror="this.onerror=null; this.src='https://placehold.co/64x64/38BDF8/08111E?text=a';" class="w-6 h-6 rounded-full object-cover border border-sky-300/30 shrink-0">
                                    <span class="text-xs text-sky-200/80 font-medium truncate">${safeAuthor}</span>
                                </div>

                                <div class="flex items-center gap-1.5 shrink-0">
                                    ${
                                        isAdmin

        window.switchUploadTab = function (mode) {
            uploadMode = mode;
            const fileWrap = document.getElementById('input-file-wrapper');
            const urlWrap = document.getElementById('input-url-wrapper');
            const tabFile = document.getElementById('tab-file');
            const tabUrl = document.getElementById('tab-url');

            if (mode === 'file') {
                fileWrap.classList.remove('hidden');
                urlWrap.classList.add('hidden');
                tabFile.className = 'px-3 py-1 rounded-lg bg-sky-400 text-ocean-950 font-bold transition';
                tabUrl.className = 'px-3 py-1 rounded-lg text-sky-200/75 hover:text-white font-semibold transition';
            } else {
                fileWrap.classList.add('hidden');
                urlWrap.classList.remove('hidden');
                tabUrl.className = 'px-3 py-1 rounded-lg bg-sky-400 text-ocean-950 font-bold transition';
                tabFile.className = 'px-3 py-1 rounded-lg text-sky-200/75 hover:text-white font-semibold transition';
            }
        };

        // Client-side Canvas Compression (Max 800px, JPEG 0.8)
        window.previewSelectedFile = function (event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const MAX_DIM = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_DIM || height > MAX_DIM) {
                        if (width > height) {
                            height = Math.round((height * MAX_DIM) / width);
                            width = MAX_DIM;
                        } else {
                            width = Math.round((width * MAX_DIM) / height);
                            height = MAX_DIM;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    compressedBase64Image = canvas.toDataURL('image/jpeg', 0.8);
                    const previewBox = document.getElementById('upload-preview-box');
                    const previewImg = document.getElementById('upload-preview-img');
                    previewImg.src = compressedBase64Image;
                    previewBox.classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.previewUrlImage = function (url) {
            const previewBox = document.getElementById('upload-preview-box');
            const previewImg = document.getElementById('upload-preview-img');
            if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
                previewImg.src = url;
                previewBox.classList.remove('hidden');
            } else {
                previewBox.classList.add('hidden');
            }
        };

        // Submit Artwork Instantly
        window.handleArtSubmit = function (event) {
            event.preventDefault();
            if (!currentUser) return;

            const title = document.getElementById('art-title-input').value.trim();
            const urlInput = document.getElementById('art-url-input').value.trim();
            const finalImage = uploadMode === 'file' ? compressedBase64Image : urlInput;

            if (!finalImage) {
                showToast(
                    currentLang === 'ar'
                        ? 'يرجى اختيار صورة من جهازك أو وضع رابط صحيح'
                        : 'Please select an image or enter a valid URL'
                );
                return;
            }

            const newPost = {
                id: 'post_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                title: title,
                imageUrl: finalImage,
                authorUid: currentUser.uid,
                authorName: currentUser.displayName,
                authorPhoto: currentUser.photoURL,
                likedBy: [],
                pinned: false,
                createdAt: Date.now()
            };

            museumPosts.unshift(newPost);
            savePostsToStorage();
            renderMuseumGrid();

            // Reset form & close modal
            document.getElementById('art-form').reset();
            compressedBase64Image = '';
            document.getElementById('upload-preview-box').classList.add('hidden');
            closeUploadModal();

            showToast(
                currentLang === 'ar'
                    ? 'تمت إضافة صورتك إلى المتحف بنجاح!'
                    : 'Your artwork has been added to the museum!'
            );
        };

        // Like / Unlike Post
        window.toggleLikePost = function (postId) {
            if (!currentUser) {
                showToast(
                    currentLang === 'ar'
                        ? 'سجل دخولك للإعجاب بالصور'
                        : 'Sign in to like artworks'
                );
                openAuthModal();
                return;
            }

            const post = museumPosts.find((p) => p.id === postId);
            if (!post) return;

            if (!Array.isArray(post.likedBy)) post.likedBy = [];
            const idx = post.likedBy.indexOf(currentUser.uid);
            if (idx > -1) {
                post.likedBy.splice(idx, 1);
            } else {
                post.likedBy.push(currentUser.uid);
            }

            savePostsToStorage();
            renderMuseumGrid();

            if (activeLightboxPostId === postId) {
                updateLightboxStats(post);
            }
        };

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            document.getElementById('confirm-cancel-btn').onclick = () => {
                modal.classList.add('hidden');

        function copyEmail() {
            const email = siteSettings.contactEmail || '9gswacontact@gmail.com';
            const tempInput = document.createElement('input');
            tempInput.value = email;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
            } catch (e) {
                if (navigator.clipboard) navigator.clipboard.writeText(email);
            }
            document.body.removeChild(tempInput);

            const btn = document.getElementById('copy-btn');
            btn.textContent = translations[currentLang].copiedBtn;
            showToast(
                currentLang === 'ar'
                    ? `تم نسخ البريد الإلكتروني: ${email}`
                    : `Copied email: ${email}`
            );

            setTimeout(() => {
                btn.textContent = translations[currentLang].copyBtn;
            }, 2000);
        }

        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('app-toast');
            document.getElementById('toast-message').textContent = msg;
            toast.classList.remove('hidden');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('hidden');
            }, 3200);
        }
